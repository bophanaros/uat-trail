<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UAT Trail · Bolt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <p class="brand">Bolt <span>UAT Trail</span></p>
        <p class="tagline">
          Mission-based UAT outside Salesforce. Do the work in Staging; record
          Pass/Fail here so history survives refreshes.
        </p>
        <div class="toolbar">
          <label class="tester-chip">
            Tester
            <input
              id="testerName"
              type="text"
              placeholder="Your name"
              style="border: none; background: transparent; padding: 0; width: 8rem"
            />
          </label>
          <span id="hunterBadge" class="hunter-badge" hidden>Bug hunter · 0</span>
          <button class="btn btn-secondary" id="exportBtn" type="button">
            Export results
          </button>
          <button class="btn btn-secondary" id="clearBtn" type="button">
            Clear my results
          </button>
        </div>
      </header>

      <div class="layout">
        <aside class="panel">
          <h2>Open epics</h2>
          <div id="epicList" class="epic-list"></div>
        </aside>

        <main class="panel">
          <div id="epicDetail" class="empty">Select an epic to start.</div>
        </main>
      </div>
    </div>

    <canvas id="fireworks" class="fireworks" aria-hidden="true"></canvas>
    <div id="catchChip" class="catch-chip" role="status" aria-live="polite" hidden>
      <strong>Nice catch · mission incomplete</strong>
      <span id="catchLine"></span>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
